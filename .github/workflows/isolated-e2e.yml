name: Isolated browser E2E

on:
  push:
    branches:
      - codex/selan-v1-test-release
  pull_request:
    branches:
      - codex/selan-v1-workflow
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install isolated browser
        run: npx playwright install --with-deps chromium
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.118.0
      - name: Install PowerShell
        shell: bash
        run: |
          if ! command -v pwsh >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y powershell
          fi
      - name: Run disposable database and browser suite
        shell: bash
        run: bash .github/ci/run-isolated-e2e.sh
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: selan-e2e-failures
          path: |
            test-results/
            playwright-report/
          retention-days: 7
