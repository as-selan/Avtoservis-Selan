# Isolated M3/M4 database suites on a disposable local Supabase Docker stack.
# Branch-scoped only. No remote Supabase link, no production secrets, no deploy.
#
# Isolation:
#   - Temporary workdir with CI-patched config (project_id=avtoservis-selan-m3-review,
#     db port=55322). Canonical supabase/config.toml is never modified.
#   - Independent Docker identity/port verification before marker install or suites.
#   - Markers installed only in explicit CI bootstrap steps.
name: Isolated DB tests

on:
  push:
    branches:
      - cursor/m3-m4-ci-db-tests-v1
      - codex/selan-v1-workflow
  pull_request:
    branches:
      - cursor/m3-m4-ci-db-tests-v1
      - codex/quibi-integration-prep
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  negative-safety:
    name: Static + negative safety probes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PowerShell
        shell: bash
        run: |
          if ! command -v pwsh >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y powershell
          fi
          pwsh -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'

      - name: Run negative safety checks
        shell: bash
        run: |
          chmod +x .github/ci/negative-safety-checks.sh
          bash .github/ci/negative-safety-checks.sh

  isolated-db-suites:
    name: M3, M4 and full-chain isolated DB suites
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: negative-safety
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Refuse production secret / remote DB env
        shell: bash
        run: |
          set -euo pipefail
          # Intentionally do NOT map any repository secrets into this job.
          for v in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD PRODUCTION_DB_PASSWORD \
                   DATABASE_URL DIRECT_URL POSTGRES_URL SUPABASE_PROJECT_ID; do
            if [[ -n "${!v:-}" ]]; then
              echo "Refusing: environment variable $v is set; isolated local CI cannot use hosted credentials." >&2
              exit 2
            fi
          done
          echo "OK: no production/remote DB credentials present in the job environment."

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          # Tested in the isolated suite; avoid the unauthenticated "latest" release lookup rate limit.
          version: 2.118.0

      - name: Install psql + PowerShell
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          if ! command -v pwsh >/dev/null 2>&1; then
            sudo apt-get install -y powershell
          fi
          docker version
          supabase --version
          psql --version
          pwsh -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'

      - name: Run isolated M3/M4 DB suite
        shell: bash
        run: |
          set -euo pipefail
          # Disposable local DB_URL is resolved only from `supabase status` inside the suite.
          # Do not inject hosted tokens or production DB passwords into this step.
          chmod +x .github/ci/prepare-ci-workdir.sh .github/ci/run-isolated-db-suite.sh
          bash .github/ci/run-isolated-db-suite.sh
